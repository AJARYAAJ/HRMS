# Nginx reverse proxy for PeopleHub (VM install). Replace hr.example.com with your domain, then run certbot:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/peoplehub
#   sudo ln -s /etc/nginx/sites-available/peoplehub /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hr.example.com
server {
    listen 80;
    server_name hr.example.com;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
